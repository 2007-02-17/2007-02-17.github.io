<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>原神 · 多角色性格契合测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      top: -20%;
      left: -20%;
      width: 140%;
      height: 140%;
      background: radial-gradient(circle at 30% 40%, rgba(255, 215, 150, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(100, 180, 255, 0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 248, 240, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      padding: 2rem 1.5rem 2.5rem;
      position: relative;
      z-index: 2;
      color: #f7f3e6;
    }

    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: 0.05em;
      color: #ffecd2;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      margin-bottom: 0.2rem;
    }

    .subtitle {
      text-align: center;
      color: #cfc5b0;
      margin-bottom: 2rem;
      font-size: 0.85rem;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.25);
      padding-bottom: 1rem;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      color: #e0d3bb;
      font-size: 0.85rem;
    }
    .progress-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      margin: 0 12px;
      overflow: hidden;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #f7d794, #f3a683);
      border-radius: 20px;
      transition: width 0.25s ease;
    }

    .question-card {
      background: rgba(20, 30, 40, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2rem;
      padding: 1.8rem 1.3rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      margin-bottom: 1.8rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }

    .question-text {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 1.8rem;
      line-height: 1.4;
      color: #fff5e6;
      text-shadow: 0 2px 6px black;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 220, 180, 0.3);
      border-radius: 2.5rem;
      padding: 1rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      color: #f9efe2;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      gap: 0.7rem;
      word-break: break-word;
    }
    .option-btn:hover {
      background: rgba(245, 200, 140, 0.2);
      border-color: #f5c382;
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.5);
    }
    .option-letter {
      background: #e6b87b;
      color: #1e272e;
      font-weight: bold;
      border-radius: 50%;
      width: 2rem;
      height: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    /* 结果卡片 */
    .result-card {
      background: rgba(15, 25, 35, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 2.2rem;
      padding: 2rem 1.2rem;
      border: 1px solid rgba(255, 215, 150, 0.4);
      box-shadow: 0 25px 35px rgba(0,0,0,0.6);
    }

    .top-character {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .character-avatar {
      font-size: 4.5rem;
      filter: drop-shadow(0 8px 12px black);
    }
    .character-name {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffd78b;
      letter-spacing: 0.05em;
    }
    .top-percent {
      font-size: 1.4rem;
      color: #f3a683;
      font-weight: 600;
    }

    .match-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin: 1.5rem 0;
    }
    .match-item {
      background: rgba(0,0,0,0.35);
      border-radius: 1.5rem;
      padding: 0.8rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ede0cc;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .match-name {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }
    .match-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 10px;
      margin: 0 1rem;
      overflow: hidden;
    }
    .match-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f7d794, #e6b87b);
      border-radius: 10px;
      width: 0%;
    }
    .retry-btn {
      background: #e6b87b;
      border: none;
      color: #1a252f;
      font-weight: bold;
      font-size: 1rem;
      padding: 0.9rem 2.2rem;
      border-radius: 3rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: 0.2s;
      letter-spacing: 0.05em;
      box-shadow: 0 8px 18px rgba(0,0,0,0.5);
      display: block;
      margin-left: auto;
      margin-right: auto;
    }
    .retry-btn:hover {
      background: #f5cf91;
      transform: scale(1.03);
    }

    .hidden {
      display: none !important;
    }

    footer {
      text-align: center;
      margin-top: 1.2rem;
      color: #9a8b78;
      font-size: 0.7rem;
    }
  </style>
</head>

          { text: "能一起胡闹的朋友", scores: { hutao:4, amber:3, klee:4, tartaglia:2 } },
          { text: "沉稳可靠的守护者", scores: { zhongli:4, qin:3, xilonen:3, ineffa:3 } },
          { text: "安静却有力量的伙伴", scores: { xiao:3, ayaka:3, wanderer:3, skirk:2 } },
          { text: "充满智慧的解惑者", scores: { nahida:4, lisa:3, yae:2, mizuki:4 } }
        ]
      }
    ];

    // 状态变量
    let currentQuestionIndex = 0;
    let scores = {};
    // 初始化所有角色分数为0
    for (let key in characters) {
      scores[key] = 0;
    }

    const quizSection = document.getElementById('quizSection');
    const resultSection = document.getElementById('resultSection');
    const questionText = document.getElementById('questionText');
    const optionsContainer = document.getElementById('optionsContainer');
    const currentQSpan = document.getElementById('currentQ');
    const totalQSpan = document.getElementById('totalQ');
    const progressFill = document.getElementById('progressFill');
    const resultCard = document.getElementById('resultCard');

    totalQSpan.textContent = questions.length;

    function renderQuestion() {
      if (currentQuestionIndex >= questions.length) {
        showResult();
        return;
      }
      const q = questions[currentQuestionIndex];
      questionText.textContent = q.text;
      optionsContainer.innerHTML = '';
      q.options.forEach((opt, idx) => {
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        const letter = String.fromCharCode(65 + idx);
        btn.innerHTML = `<span class="option-letter">${letter}</span>${opt.text}`;
        btn.addEventListener('click', () => selectOption(opt));
        optionsContainer.appendChild(btn);
      });
      currentQSpan.textContent = currentQuestionIndex + 1;
      const progressPercent = (currentQuestionIndex / questions.length) * 100;
      progressFill.style.width = `${progressPercent}%`;
    }

    function selectOption(option) {
      for (let [char, points] of Object.entries(option.scores)) {
        if (scores.hasOwnProperty(char)) {
          scores[char] += points;
        }
      }
      currentQuestionIndex++;
      renderQuestion();
    }

    function showResult() {
      quizSection.classList.add('hidden');
      resultSection.classList.remove('hidden');

      // 按分数降序排序
      const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
      const maxScore = sorted[0][1] || 1; // 防止除以0
      // 取前8名展示
      const topEntries = sorted.slice(0, 8);
      const topCharKey = topEntries[0][0];
      const topChar = characters[topCharKey];

      let listHTML = '';
      topEntries.forEach(([key, score]) => {
        const char = characters[key];
        const percent = Math.round((score / maxScore) * 100);
        listHTML += `
          <div class="match-item">
            <span class="match-name">${char.avatar} ${char.name}</span>
            <div class="match-bar-bg"><div class="match-bar-fill" style="width:${percent}%;"></div></div>
            <span style="font-weight:600; min-width:45px;">${percent}%</span>
          </div>
        `;
      });

      resultCard.innerHTML = `
        <div class="top-character">
          <div class="character-avatar">${topChar.avatar}</div>
          <div class="character-name">${topChar.name}</div>
          <div class="top-percent">契合度 ${Math.round((topEntries[0][1]/maxScore)*100)}%</div>
        </div>
        <div class="match-list">
          ${listHTML}
        </div>
        <button class="retry-btn" id="retryButton">⟳ 重新测试</button>
      `;

      document.getElementById('retryButton').addEventListener('click', resetTest);
    }

    function resetTest() {
      for (let key in scores) {
        scores[key] = 0;
      }
      currentQuestionIndex = 0;
      resultSection.classList.add('hidden');
      quizSection.classList.remove('hidden');
      renderQuestion();
    }

    renderQuestion();
  })();
</script>
</body>
</html>
